###########################################################################
# application-prod.yml
# ?? Prod (운영/회사) 환경 전용 설정 파일
# - 공통(application.yml)을 상속받고, 아래 값들만 덮어씀
###########################################################################

###########################################################################
# ?? 서버 쿠키 정책 (HTTP 서비스이므로 secure=false 유지)
###########################################################################
app:
  cookie:
    same-site: Lax
    # 현재 HTTP 서비스이므로 기본값 'false' 유지
    secure: ${COOKIE_SECURE:false}

###########################################################################
# ?? Python 실행 환경 설정 (운영 서버 Windows 환경 가정)
###########################################################################
python:
  # 1. 서버에 설치된 Python 실행 파일의 절대 경로 (ENV: PYTHON_EXECUTABLE)
  executable:
    path: ${PYTHON_EXECUTABLE:C:/Python310/python.exe}

  # 2. 서버에서 프로젝트 Python 스크립트 및 데이터가 위치할 고정 경로 (ENV: PYTHON_ROOT_PATH)
  root:
    path: ${PYTHON_ROOT_PATH:C:/SET_MyBaseLinkV2/server/python_scripts}
    
  # 🚨 [추가 반영] 배포 시 이전 파일을 백업할 경로 (ENV: PYTHON_BACKUP_PATH)
  backup:
    path: ${PYTHON_BACKUP_PATH:C:/SET_MyBaseLinkV2/server/backup/py_scripts} 

  working:
    dir: "${python.root.path}/python/stock/py"

  update_stock_listing:
    path: "${python.root.path}/python/stock/py/update_stock_listing.py"

  update_stock_listing_prod:
    path: "${python.root.path}/python/stock/py/update_stock_listing_prod.py"

  athena_k_market_ai_prod:
    path: "${python.root.path}/python/stock/py/athena_k_market_ai_prod.py"

  stock:
    stock_listing:
      path: "${python.root.path}/python/data/stock_list/stock_listing.json"

    stock_listing_prod:
      path: "${python.root.path}/python/data/stock_list/stock_listing_prod.json"


###########################################################################
# ? DataSource (PostgreSQL 접속)
# ?? 보안 확보: DB 인증 정보는 반드시 환경 변수(ENV)로 주입
###########################################################################
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    # ENV: DB_URL (사용자 기준 유지)
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mybaselink_db?currentSchema=mybaselink} 
    # ENV: DB_USERNAME (사용자 기준 유지)
    username: ${DB_USERNAME:mybaseuser}
    # ENV: DB_PASSWORD (사용자 기준 유지)
    password: ${DB_PASSWORD:mybaseuser1234} 
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      validation-timeout: 5000
      leak-detection-threshold: 0

  jpa:
    hibernate:
      ddl-auto: none # ✅ 운영 안정화를 위해 validate로 변경 완료
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect