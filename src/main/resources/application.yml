###########################################################################
# application.yml
# 🎯 어떤 환경을 기본으로 실행할지 결정 (local / prod)
###########################################################################
spring:
  profiles:
    active: prod  # 기본값은 로컬
    group:
      # 1. 로컬 개발 세트 (로컬 설정 + 로컬 DB)
      "local": "local,local-db"

      # 2. 로컬 개발 테스트 ** DB만 운용 세트 (로컬 설정 + 운영 DB)
      "local-prod": "local,prod-db"
      
      # 3. 운영 서버 세트 (운영 설정 + 운영 DB)
      "prod": "prod,prod-db"


  #########################################################################
  # ✅ 애플리케이션 정보
  #########################################################################
  application:
    name: MyBaseLinkV2

  #########################################################################
  # ✅ UI 템플릿 엔진(Thymeleaf)
  #########################################################################
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
    mode: HTML
    encoding: UTF-8

  #########################################################################
  # ✅ 정적 리소스 제공 경로
  #########################################################################
  web:
    resources:
      static-locations: classpath:/static/,classpath:/public/,classpath:/resources/

  #########################################################################
  # ✅ 파일 업로드 설정
  #########################################################################
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

  #########################################################################
  # ✅ DevTools 자동 리로드 설정 (단일 문자열 포맷으로 최종 수정)
  #########################################################################
  devtools:
    restart:
      enabled: true
      poll-interval: 1000
      quiet-period: 500
      # 🛠️ 최종 수정: 문법 오류를 피하기 위해 쉼표로 구분된 단일 문자열 사용
      exclude: "**/*.py,templates/**,static/**,public/**,resources/**"
    livereload:
      enabled: true       # 🔄 Live Reload는 켜 둡니다.

###########################################################################
# 🖥 서버 공통 설정
###########################################################################
server:
  port: 8080
  servlet:
    context-path: /
  error:
    whitelabel:
      enabled: false

lock:
  max-concurrent-users: 1  # 기본 1명, 향후 2로 변경 가능

###########################################################################
# 🔐 JWT 토큰 설정 (공통)
###########################################################################
jwt:
  secret: MyNovaSecretKeyChangeThisToSomethingStrong123!
  expiration: 3600000

###########################################################################
# 🔐 Security (JWT) 예외 경로 설정
###########################################################################
security:
  jwt:
    ignore-paths:
      - /api/stock/lastCloseDownward/chart/**
      - /api/stock/lastCloseDownward/sse
      - /api/stock/batch/sse
      - /api/stock/batch/prod/sse
      - /api/stock/batch/gprod/sse
      - /api/stock/similar-advanced/chart/**
      - /api/stock/similar-advanced/sse      

###########################################################################
# 🧠 로깅 레벨 (공통)
###########################################################################
logging:
  level:
    '[org.hibernate.SQL]': ERROR
    '[org.hibernate.type.descriptor.sql.BasicBinder]': ERROR
    '[com.mybaselink]': DEBUG
    '[org.springframework]': INFO
    '[org.apache.catalina.connector.CoyoteAdapter]': ERROR
    '[org.apache.coyote.http11.Http11Processor]': ERROR
    '[org.apache.catalina.connector.OutputBuffer]': ERROR

###########################################################################
#  (공통) KEY 전자공시시스템
###########################################################################
opendart:
  dart_api_key: 599b24c052bb23453a48da3916ae7faf1befd03e