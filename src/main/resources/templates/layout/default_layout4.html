<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=3.0">
  <title th:text="${title} ?: 'MyBaseLink'">MyBaseLink</title>

  <th:block th:if="${_csrf} != null">
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
  </th:block>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="apple-touch-icon" sizes="57x57" href="/favicon/apple-icon-57x57.png">
  <link rel="apple-touch-icon" sizes="60x60" href="/favicon/apple-icon-60x60.png">
  <link rel="apple-touch-icon" sizes="72x72" href="/favicon/apple-icon-72x72.png">
  <link rel="apple-touch-icon" sizes="76x76" href="/favicon/apple-icon-76x76.png">
  <link rel="apple-touch-icon" sizes="114x114" href="/favicon/apple-icon-114x114.png">
  <link rel="apple-touch-icon" sizes="120x120" href="/favicon/apple-icon-120x120.png">
  <link rel="apple-touch-icon" sizes="144x144" href="/favicon/apple-icon-144x144.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/favicon/apple-icon-152x152.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-icon-180x180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon/android-icon-192x192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon/favicon-96x96.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
  <link rel="manifest" href="/favicon/manifest.json">
  <meta name="msapplication-TileColor" content="#ffffff">
  <meta name="msapplication-TileImage" content="/favicon/ms-icon-144x144.png">
  <meta name="theme-color" content="#ffffff">

  <link rel="stylesheet" href="/css/common/commonLayout.css">
  <link rel="stylesheet" href="/css/common/commonTable.css">
  <link rel="stylesheet" href="/css/common/commonSearch.css">
  <link rel="stylesheet" href="/css/common/commonPagination.css">
  <link rel="stylesheet" href="/css/common/commonModal.css">
  <link rel="stylesheet" href="/css/common/commonToast.css">
  <link rel="stylesheet" href="/css/common/commonTop.css">
  <link rel="stylesheet" href="/css/common/commonLeft.css">

  <style>
    /* 하단 정보 바 스타일 - 원본 유지 및 보강 */
    .bottom-info-bar {
      position: fixed !important;
      bottom: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 28px !important; 
      background-color: #f8f9fa !important;
      border-top: 1px solid #dee2e6 !important;
      display: flex !important;
      align-items: center !important;
      z-index: 999999 !important;
      font-family: 'Pretendard', sans-serif;
      box-shadow: 0 -1px 5px rgba(0,0,0,0.05);
    }

    body.dark-mode .bottom-info-bar {
      background-color: #000000 !important;
      border-top: 1px solid #333333 !important;
    }

    .info-bar-content {
      width: 100%;
      display: flex;
      justify-content: flex-start; 
      align-items: center;
      padding: 0 10px;
      gap: clamp(6px, 1.2vw, 12px);
      overflow: hidden;
    }

    .info-group {
      display: flex;
      align-items: center;
      gap: 3px;
      white-space: nowrap;
      font-size: clamp(8px, 1vw, 11px);
    }

    .label-text { color: #666; font-weight: 500; }
    body.dark-mode .label-text { color: #999; }
    .value-text { color: #212529; font-weight: 700; }
    body.dark-mode .value-text { color: #f1f3f5; }

    .up-color { color: #e03131; font-size: 0.8em; }
    .down-color { color: #1971c2; font-size: 0.8em; }

    .update-group {
      font-size: clamp(7px, 0.8vw, 10px);
      margin-left: 4px;
    }

    .refresh-btn {
      margin-left: auto; 
      cursor: pointer;
      color: #868e96;
      font-size: 11px;
      padding: 4px;
      transition: color 0.2s;
      display: flex;
      align-items: center;
    }
    .refresh-btn:hover { color: #212529; }
    body.dark-mode .refresh-btn:hover { color: #fff; }

    .spinning { animation: fa-spin 1s infinite linear; }

    @media (max-width: 480px) {
      .info-bar-content { padding: 0 6px; gap: 4px; }
      .update-group { display: none; } 
    }

    /* 하단 바 공간 확보 */
    body { padding-bottom: 28px !important; }
  </style>
</head>

<body style="position: relative; margin: 0; padding: 0;">

  <div style="position: sticky; top: 0; z-index: 5000;">
    <th:block th:replace="~{fragments/top :: topFragment}"></th:block>
  </div>

  <div id="sidebarOverlay" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.4); z-index: 2999; display: none; pointer-events: auto;"></div>

  <div id="layoutWrapper" style="position: relative; width: 100%; display: flex; align-items: stretch; min-height: calc(100vh - 50px);">
    <div th:replace="~{fragments/left :: leftFragment}"></div>
    <main id="mainContentArea" style="flex: 1; min-width: 0;">
      <div class="content" layout:fragment="content"></div>
    </main>
  </div>

  <footer th:replace="~{fragments/bottom :: bottomFragment}"></footer>

  <!-- 하단 정보 바 영역 -->
<div class="bottom-info-bar">
    <div class="info-bar-content">
      <div class="info-group">
        <span class="label-text">USD</span>
        <span class="value-text" id="val-usd" th:text="${exchange != null ? exchange.USD : '1,342'}">1,342</span>
      </div>
      <div class="info-group">
        <span class="label-text">JPY</span>
        <span class="value-text" id="val-jpy" th:text="${exchange != null ? exchange.JPY : '920'}">920</span>
      </div>
      <div class="info-group">
        <span class="label-text">EUR</span>
        <span class="value-text" id="val-eur" th:text="${exchange != null ? exchange.EUR : '1,450'}">1,450</span>
      </div>
      <div class="info-group">
        <span class="label-text">나스닥</span>
        <span class="value-text" id="val-nasdaq">16,397 <span class="up-color">▲</span></span>
      </div>
      <div class="info-group">
        <span class="label-text">코스피</span>
        <span class="value-text" id="val-kospi">2,580 <span class="down-color">▼</span></span>
      </div>
      <div class="info-group update-group">
        <span class="label-text"><i class="fa-regular fa-clock" style="font-size: 8px;"></i></span>
        <span class="value-text" id="val-time" style="font-weight: 400;" th:text="${exchange != null && exchange.updateTime != null ? exchange.updateTime : '실시간'}">00:00</span>
      </div>
      <div class="refresh-btn" id="btn-refresh-info" title="정보 업데이트" onclick="handleExchangeRefresh(event)">
        <i id="refresh-icon" class="fa-solid fa-rotate-right"></i>
      </div>
    </div>
  </div>

  <script th:inline="javascript">
  /*
  |--------------------------------------------------------------------------
  | 환율 및 금융 데이터 새로고침 (전역 스코프 보호)
  |--------------------------------------------------------------------------
  */
  let __isExchangeFetching = false;

  async function handleExchangeRefresh(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    if (__isExchangeFetching) return;

    const icon = document.getElementById('refresh-icon');
    const btn = document.getElementById('btn-refresh-info');

    __isExchangeFetching = true;
    if (icon) icon.classList.add('spinning');
    if (btn) btn.style.opacity = '0.5';

    try {
      // 캐시 방지 파라미터 추가
      const response = await fetch('/api/exchange/latest?nocache=' + Date.now(), {
        method: 'GET',
        headers: { 'Accept': 'application/json' }
      });

      if (response.ok) {
        const data = await response.json();
        
        // 데이터 존재 여부 확인 후 업데이트
        if (data) {
          if (data.USD) document.getElementById('val-usd').innerText = data.USD;
          if (data.JPY) document.getElementById('val-jpy').innerText = data.JPY;
          if (data.EUR) document.getElementById('val-eur').innerText = data.EUR;
          if (data.updateTime) document.getElementById('val-time').innerText = data.updateTime;
        }
      }
    } catch (err) {
      console.error("Exchange Update Error:", err);
    } finally {
      // 애니메이션 시각적 효과를 위해 최소 지연시간 부여
      setTimeout(() => {
        if (icon) icon.classList.remove('spinning');
        if (btn) btn.style.opacity = '1';
        __isExchangeFetching = false;
      }, 500);
    }
  }

  /*
  |--------------------------------------------------------------------------
  | 기존 사이드바 및 레이아웃 로직 (100% 원본 유지)
  |--------------------------------------------------------------------------
  */
  document.addEventListener("DOMContentLoaded", () => {
    const sidebar = document.getElementById("left");
    const overlay = document.getElementById("sidebarOverlay");

    function forceCloseSidebar() {
      if (sidebar && sidebar.classList.contains("open")) {
        sidebar.classList.remove("open");
        if (overlay) overlay.style.display = "none";
      }
    }

    window.toggleSidebar = () => {
      if (!sidebar) return;
      const isOpen = sidebar.classList.contains("open");
      if (isOpen) {
        forceCloseSidebar();
      } else {
        sidebar.classList.add("open");
        if (overlay) overlay.style.display = "block";
      }
    };

    const handleCloseAction = (e) => {
      if (!sidebar || !sidebar.classList.contains("open")) return;
      const path = e.composedPath();
      const toggleBtn = document.getElementById('menuToggle');
      const bottomBar = document.querySelector('.bottom-info-bar');

      if (path.includes(sidebar)) return;
      if (toggleBtn && path.includes(toggleBtn)) return;
      if (bottomBar && path.includes(bottomBar)) return;

      forceCloseSidebar();
    };

    window.addEventListener("wheel", handleCloseAction, { passive: true });
    window.addEventListener("mousedown", handleCloseAction);
    window.addEventListener("touchmove", handleCloseAction, { passive: true });
    
    if (overlay) {
      overlay.addEventListener("click", forceCloseSidebar);
    }
  });
  </script>

  <!-- 외부 스크립트 로드 순서 유지 -->
  <script src="/js/common/common_loadseq_1_Loading_op.js"></script>
  <script src="/js/common/common_loadseq_2_Notify_op.js"></script>
  <script src="/js/common/common_loadseq_3_Pagination_op.js"></script>
  <script src="/js/common/common_loadseq_4_Modal_op.js"></script>
  <script src="/js/common/common_loadseq_5_UnifiedList_op.js"></script>
  <script src="/js/common/common_loadseq_6_Left_op.js"></script>
  
  <th:block layout:fragment="pageScript"></th:block>

  <script>
    // 뷰포트 높이 설정 (모바일 브라우저 대응)
    function setVhUnit() {
      const vh = window.innerHeight * 0.01;
      document.documentElement.style.setProperty('--vh', `${vh}px`);
    }
    setVhUnit(); 
    window.addEventListener("resize", setVhUnit); 
  </script>
</body>
</html>
