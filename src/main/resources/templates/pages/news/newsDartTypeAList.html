<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default_layout}">

<head>
  <meta charset="UTF-8">
  <title>전자공시시스템-공시</title>
  <style>
    /* 테이블 우측 공백 제거 및 레이아웃 최적화 */
    .table-container table { table-layout: fixed !important; width: 100% !important; }
    .column-title { text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* 종목명 링크 스타일 */
    .stock-link { color: #2563eb !important; font-weight: bold; text-decoration: underline; cursor: pointer; }
    .stock-link:hover { color: #1d4ed8 !important; }
  </style>
</head>

<body>
<div layout:fragment="content">

  <div class="content-container">
    <div class="page-header">
      <div class="page-title">
        <h2 th:text="${pageTitle} ?: '📄 기본 페이지 제목'">공시</h2>
      </div>
      <div class="breadcrumb">
        <i class="fas fa-folder-open"></i>
        <span th:text="${breadcrumb} ?: '시스템 / 기본 경로'"> 뉴스 / 공시</span>
      </div>
    </div>    

    <div class="toolbar">
      <div class="search-group">
        <input type="text" id="searchInput" placeholder="검색어 입력" />
        <button id="searchBtn" class="btn"><i class="fas fa-search"></i></button>
        <button class="btn"><i class="fas fa-filter"></i></button>
        <button class="btn"><i class="fas fa-sync-alt"></i></button>
      </div>
    </div>

    <div class="list-info">
      <span id="totalCount">총 0건</span>
      <div class="action-buttons">
        <button id="excelBtn" class="btn excel" title="엑셀 다운로드"><i class="fa-solid fa-file-excel"></i></button>
        <button id="addBtn" class="btn" title="추가"><i class="fas fa-plus"></i></button>
        <button id="deleteSelectedBtn" class="btn red" title="삭제"><i class="fas fa-trash"></i></button>
      </div>
    </div>

    <div style="position: relative;">
        <div id="globalLoading" class="global-loading-overlay">
            <div class="global-spinner-wrap"><div class="spinner"></div></div>
        </div>
        <div class="table-container">
          <table>
            <thead id="headerTable"></thead>
            <tbody id="dataTable"></tbody>
          </table>
        </div>
    </div> 
    
    <div id="pagination" class="pagination"></div>
  </div>
</div>

<th:block layout:fragment="pageScript">
<script>
/** * ✅ 기기별 최적화 앱 호출 함수 (iPhone/Android/PC 통합)
 * 미래에셋 아이폰 호출 실패 대응 보강
 */
function openBrokerApp(type, stockCode) {
    if (!stockCode || stockCode.trim() === "") {
        alert("종목 코드가 없습니다.");
        return;
    }

    const ua = navigator.userAgent.toLowerCase();
    const isAndroid = /android/i.test(ua);
    const isIos = /iphone|ipad|ipod/i.test(ua);
    
    let url = "";

    // 1. 기기별 호출 주소(Scheme/Intent) 설정
    switch(type) {
        case 'mstock': 
            if (isAndroid) {
                // 미래에셋 안드로이드 (인텐트 방식)
                url = `intent://open?page=1101&code=${stockCode}#Intent;scheme=mstock;package=com.miraeasset.trade;end`;
            } else {
                // 🚩 아이폰 미래에셋: 통합앱용 최신 스킴을 먼저 사용
                url = `miraeasset-mstock://open?page=1101&code=${stockCode}`;
            }
            break;
        case 'kiwoom': 
            url = isAndroid
                ? `intent://open?page=100&code=${stockCode}#Intent;scheme=kiwoommts;package=com.pantech.app.kiwoom;end`
                : `kiwoommts://open?page=100&code=${stockCode}`;
            break;
        case 'toss': url = `supertoss://stock/detail?code=${stockCode}`; break;
        case 'kakao': url = `kakaotalk://kakaopay/securities/stock_detail?stock_code=${stockCode}`; break;
        case 'namu': url = `nhqvnamu://open?page=stockDetail&code=${stockCode}`; break;
        default: url = `miraeasset-mstock://open?page=1101&code=${stockCode}`;
    }

    // 2. 실행 방식 결정
    if (isIos) {
        // 아이폰: 직접 할당 방식이 가장 정확함
        window.location.href = url;
        
        // 🚩 미래에셋일 경우, 혹시 구형 앱일 수 있으니 0.5초 뒤 구형 스킴으로 한 번 더 시도
        if(type === 'mstock') {
            setTimeout(() => {
                window.location.href = `mstock://open?page=1101&code=${stockCode}`;
            }, 500);
        }
    } else {
        // 안드로이드: 가상 클릭 방식
        const a = document.createElement('a');
        a.href = url;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { document.body.removeChild(a); }, 100);
    }
}

document.addEventListener("DOMContentLoaded", () => {
  initUnifiedList({
      mode: "server",
      pagination: true,
      apiUrl: "/api/newsDartTypeAList",
      tableBodySelector: "#dataTable",
      paginationSelector: "#pagination",
      searchInputSelector: "#searchInput",
      searchBtnSelector: "#searchBtn",
      excelBtnSelector: "#excelBtn",
      excelFileName: "공시리스트.xlsx",
      
      columns: [
        { columnId: "id", label: "No" , align: "center", width: "50px"},
        { columnId: "stockCode", label: "stockCode", hidden: true},
        
        // 🚩 회사명 클릭 시 아이폰/안드로이드 즉시 실행
        { columnId: "stockName", label: "회사명", width: "80px", align: "left",
          /*   formatter: (val, row) => {
                if (row.stockCode) {
                    return `<span class="stock-link" onclick="openBrokerApp('mstock', '${row.stockCode}')">${val}</span>`;
                }
                return val;
            } */
        },
        
        { columnId: "featureOption", label: "재무상태" , align: "center", width: "80px",
            formatter: (val, row) => {
                if (!val || val.includes("재무미확인")) return `<span class="badge" style="background:#ccc; color:#fff">미확인</span>`;
                if (val.includes("흑자")) return `<b style="color:#e74c3c;"><i class="fa-solid fa-caret-up"></i> ${val}</b>`;
                if (val.includes("적자")) return `<b style="color:#3498db;"><i class="fa-solid fa-caret-down"></i> ${val}</b>`;
                return val;
            }  
        },
        
        // 🚩 제목 유동 너비 (우측 공백 제거)
        { columnId: "title", label: "공시제목" , width: "140px", className: "column-title" },
        
        { columnId: "link", label: "링크" , isExternalLink:true, width: "50px", align: "center"},
        { columnId: "mstock", label: "앱" ,  width: "50px", align: "center",
            formatter: (val, row) => {
                if (row.stockCode && row.stockCode.length >= 6) {
                    return `
                        <div class="app-dropdown" onclick="event.stopPropagation();">
                            <button class="app-dropbtn">선택 ▾</button>
                            <div class="app-dropdown-content">
                                <a href="javascript:void(0)" onclick="openBrokerApp('mstock', '${row.stockCode}')">미래에셋</a>
                                <a href="javascript:void(0)" onclick="openBrokerApp('kiwoom', '${row.stockCode}')">키움</a>
                                <a href="javascript:void(0)" onclick="openBrokerApp('toss', '${row.stockCode}')">토스</a>
                                <a href="javascript:void(0)" onclick="openBrokerApp('kakao', '${row.stockCode}')">카카오</a>
                            </div>
                        </div>
                    `;
                }
                return "-";
            } 
        },
        { columnId: "serverStatus", label: "시장" , align: "center", width: "50px"},
        { columnId: "rawDate", label: "접수일" , align: "center", width: "80px"}
      ],
      pageSize: 15,
      pageGroupSize: window.pageGroupSize, 
      enableRowClickDetail: false,
      enableDetailView: false,
      buttons: { search: true, searchInput: true, add: false, deleteSelected: false, excel: false }
  });

  // 엔터키 검색
  const searchInput = document.getElementById("searchInput");
  if(searchInput) {
      searchInput.addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("searchBtn").click(); });
  }
});
</script>
</th:block>
</body>
</html>
