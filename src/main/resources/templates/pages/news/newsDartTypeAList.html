<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default_layout}">

<head>
  <meta charset="UTF-8">
  <title>전자공시시스템-공시</title>
</head>

<body>
<div layout:fragment="content">
  <div class="content-container">
		<div class="page-header">
		  <div class="page-title">
		    <h2 th:text="${pageTitle} ?: '📄 기본 페이지 제목'">공시</h2>
		  </div>
		  <div class="breadcrumb">
		    <i class="fas fa-folder-open"></i>
		    <span th:text="${breadcrumb} ?: '시스템 / 기본 경로'"> 뉴스 / 공시</span>
		  </div>
		</div>    

    <!-- 🔍 검색 툴바 -->
    <div class="toolbar">
      <div class="search-group">
        <input type="text" id="searchInput" placeholder="검색어 입력" />
        <button id="searchBtn" class="btn"><i class="fas fa-search"></i></button>
        <button class="btn"><i class="fas fa-filter"></i></button>
        <button class="btn"><i class="fas fa-sync-alt"></i></button>
      </div>
    </div>

    <!-- 📊 리스트 정보 + 버튼 -->
    <div class="list-info">
      <span id="totalCount">총 0건</span>
      <div class="action-buttons">
        <button id="excelBtn" class="btn excel" title="엑셀 다운로드"><i class="fa-solid fa-file-excel"></i></button>
        <button id="addBtn" class="btn" title="추가"><i class="fas fa-plus"></i></button>
        <button id="deleteSelectedBtn" class="btn red" title="삭제"><i class="fas fa-trash"></i></button>
      </div>
    </div>

    <!-- 🧾 테이블 -->
    <div class="table-container">
      <table>
        <thead>
        <tr>
          <th><input type="checkbox" id="checkAll" /></th>
          <th>No</th>
          <th>공시제목</th>
          <th>회사명</th>
          <th>접수일</th>
          <th>시장</th>
          <th>재무상태</th>
          <th>링크</th>
        </tr>
        </thead>
        <tbody id="dataTable"></tbody>
      </table>
    </div>

    <!-- 📑 페이징 -->
    <div id="pagination" class="pagination"></div>
  </div>
  

	<!-- 🧩 상세 모달 -->
	<div id="detailModal" class="modal">
	<div class="elegant-modal" style="max-width: 90%; width: 1200px;"> <div class="elegant-header">
	    <h3>공시 원문 보기</h3>
	    <span data-close="detailModal" class="close-btn">&times;</span>
	  </div>
	  <div class="elegant-body" style="height: 700px; padding: 0;">
	    <iframe id="dartViewer" src="" style="width: 100%; height: 100%; border: none;"></iframe>
	    </div>
	    <div class="modal-footer elegant-footer">
	      <button class="btn gray" data-close="detailModal">닫기</button>
	    </div>
	  </div>
	</div>

</div>

<!-- ✅ 페이지 스크립트 -->
<th:block layout:fragment="pageScript">
<script>
document.addEventListener("DOMContentLoaded", () => {
  initUnifiedList({
    mode: "server", // server or client
    pagination: true,
    apiUrl: "/api/newsDartTypeAList",
    tableBodySelector: "#dataTable",
    paginationSelector: "#pagination",
    searchInputSelector: "#searchInput",
    searchBtnSelector: "#searchBtn",
    addBtnSelector: "#addBtn",
    modalId: "#addModal",
    saveBtnSelector: "#saveBtn",
    closeBtnSelector: "[data-close]",
    checkAllSelector: "#checkAll",
    deleteSelectedBtnSelector: "#deleteSelectedBtn",
    detailModalId: "#detailModal",
    updateBtnSelector: "#updateBtn",
    excelBtnSelector: "#excelBtn",

    excelFileName: "DART_공시리스트.xlsx",
    
    columns: [
  	  // 체크박스 있는 테이블{ checkbox: true } 사용
  	  // 체크박스 없는 테이블checkbox 컬럼 자체 삭제
    	
      { key: "checkbox", label: "", checkbox: false }, 
      { key: "id", label: "No" },
      { key: "title", label: "공시제목", isDetailLink: false, required: true },
      { key: "owner", label: "회사명", isDetailLink: false, required: true },
      { key: "regDate", label: "접수일" },
      { key: "serverStatus", label: "시장" },
      { key: "featureOption", label: "재무상태" },
      { key: "remark", label: "링크" , isPopupView:true}
    ],
    pageSize: 10,
    pageGroupSize: window.pageGroupSize, <!-- ✅ 이제 전역변수로부터 자동 주입 -->
    enableRowClickDetail: false,
    enableDetailView: false,
    buttons: {
      search: true,
      searchInput: true,
      add: false,
      deleteSelected: false,
      excel: false
    },
    detailViewButtons: {
      update: true,
      delete: false
    },
    
 	// ✅ 상세 모달이 열릴 때 실행될 콜백 함수
    onDetailModalOpen: (id) => {
      console.log("🔍 상세 데이터 로드 ID:", id);
      
      // 1. 현재 테이블에서 해당 행의 데이터를 찾거나 서버에 다시 요청하여 링크(remark)를 가져옵니다.
      // 보통 unifiedListManager가 내부 데이터를 가지고 있으므로 해당 row의 remark를 추출합니다.
      const rowData = unifiedListManager.getRowData(id); 
      const dartUrl = rowData.remark; // 서비스에서 넣어준 DART 링크

      // 2. iframe의 src에 주소 삽입
      const iframe = document.getElementById("dartViewer");
      if (iframe && dartUrl) {
          iframe.src = dartUrl;
      }
    }
  });

  const searchInput = document.getElementById("searchInput");
  const searchBtn = document.getElementById("searchBtn");
  searchInput.addEventListener("keydown", e => {
	  if (e.key === "Enter") searchBtn.click(); 
  });
  
  

  const customFilterBtn = document.getElementById("customFilterBtn");
  if (customFilterBtn) {
    customFilterBtn.addEventListener("click", () => {
      alert("🎯 커스텀 필터 실행");
      unifiedListManager.loadList(0, "web", "filter=active");
    });
  }
});
</script>
</th:block>

</body>
</html>
